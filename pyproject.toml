[project]
name = "ninjaone-library"
version = "1.1.0"
description = "Read-only Python bindings for the NinjaOne Public API v2: organisations, devices, software, patches and KBs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "packaging>=24.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
]

[project.scripts]
ninjaone = "NinjaOne.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.5",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/NinjaOne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: read-only calls to a real NinjaOne instance; needs a .env (pytest -m live)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# N999: the import name is CamelCase on purpose, matching the FreshService library.
ignore = ["N999"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
